[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-isicell"
version = "0.1.0"
description = "An MCP server that makes ISiCell drivable by an LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.6",
]

[project.scripts]
mcp-isicell = "mcp_isicell.__main__:main"

# Tooling goes in a dependency group, not an extra, so `uv run pytest` resolves
# the project's own pytest rather than whatever happens to be on PATH.
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["mcp_isicell*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Tests live inside the package, beside the code they pin.
testpaths = ["mcp_isicell/tests"]
markers = [
    "integration: needs a real ISiCell checkout with submodules initialised and a C++ toolchain. Deselected by default; `pytest -m integration` runs them.",
]
